<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monstros Tibia</title>
<style>
:root{--bg:#12151d;--card:#1c2130;--card2:#232a3d;--line:#33405c;--txt:#d6dbea;--mut:#8a93ad;--gold:#f2c14e;--green:#59d659;--red:#ff6a5a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:13px/1.4 Verdana,Tahoma,sans-serif}
header{position:sticky;top:0;z-index:2;background:#0c0f16;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
h1{margin:0;font-size:18px;color:var(--gold);white-space:nowrap}
.filtros{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.filtros button{background:#161a26;border:1px solid var(--line);color:var(--mut);padding:5px 10px;border-radius:3px;cursor:pointer;font:inherit;font-weight:bold}
.filtros button.on{color:var(--gold);border-color:var(--gold)}
input,select{background:#0a0c12;border:1px solid var(--line);color:#fff;padding:6px 10px;border-radius:3px;font:inherit}
input{flex:1;min-width:150px}
.info{color:var(--mut);font-size:11px;padding:8px 16px 0}
main{padding:12px 16px 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:var(--card);border:1px solid #000;box-shadow:inset 0 0 0 1px var(--line);border-radius:4px;padding:8px;text-align:center}
.pic{height:96px;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 70%,#2c3a26,#151b12);border-radius:3px;margin-bottom:6px;position:relative}
.pic img{image-rendering:pixelated;width:64px;height:64px;transform:scale(1.4)}
.pic .fail{color:var(--red);font-size:11px;padding:6px}
.card b{display:block;font-size:12px;color:#fff;word-break:break-word}
.est{color:var(--gold);font-size:12px;letter-spacing:1px}
.card small{display:block;color:var(--mut);font-size:11px}
.atk{margin-top:4px;font-size:10px;color:#c9a6ff;min-height:13px}
.vazio{color:var(--mut);padding:20px 0}
@media(max-width:600px){.grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}}
</style>
</head>
<body>
<header>
